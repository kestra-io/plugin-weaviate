services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.39.7
    ports:
      - 51525:8080
      - 51526:50051
    restart: on-failure
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      # Low cap so Delete's batching over QUERY_MAXIMUM_RESULTS is exercised with few objects.
      QUERY_MAXIMUM_RESULTS: 100
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
      ENABLE_MODULES: 'text2vec-model2vec'
      MODEL2VEC_INFERENCE_API: 'http://model2vec:8080'
      CLUSTER_HOSTNAME: 'node1'
    depends_on:
      - model2vec

  model2vec:
    image: cr.weaviate.io/semitechnologies/model2vec-inference:minishlab-potion-base-4M-1.2.1
